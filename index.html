<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>₹99 Store - Everything at ₹99</title>
    <style>
        /* ========== RESET & BASE ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f5f3f0;
            color: #1a1a1a;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* ========== HEADER ========== */
        .header {
            background: #ffffff;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.06);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 0.8rem 0;
        }

        .header-inner {
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.8rem;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            color: #dc2626;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            cursor: pointer;
        }

        .logo span {
            background: #dc2626;
            color: #fff;
            padding: 0.1rem 0.6rem;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 700;
        }

        .search-bar {
            flex: 1;
            max-width: 450px;
            min-width: 180px;
            position: relative;
        }

        .search-bar input {
            width: 100%;
            padding: 0.6rem 1rem 0.6rem 2.8rem;
            border-radius: 50px;
            border: 2px solid #e5e5e5;
            background: #f8f7f5;
            font-size: 0.9rem;
            outline: none;
            transition: 0.3s;
        }

        .search-bar input:focus {
            border-color: #dc2626;
            background: #fff;
        }

        .search-bar .icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.4;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 1.2rem;
        }

        .header-actions button {
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            position: relative;
            padding: 0.3rem;
            border-radius: 50%;
            transition: 0.2s;
        }

        .header-actions button:hover {
            background: #f0eeeb;
        }

        .header-actions .user-btn {
            font-size: 1.2rem;
            color: #4a4a4a;
        }

        .badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: #dc2626;
            color: #fff;
            font-size: 0.55rem;
            font-weight: 700;
            padding: 0.1rem 0.4rem;
            border-radius: 50%;
            min-width: 20px;
            text-align: center;
        }

        .badge.wishlist-badge {
            background: #8b5cf6;
        }

        /* ========== NAV / CATEGORIES ========== */
        .nav-categories {
            background: #fff;
            border-bottom: 1px solid #f0eeeb;
            padding: 0.6rem 0;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .nav-categories::-webkit-scrollbar {
            display: none;
        }

        .categories-inner {
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 1.5rem;
            display: flex;
            gap: 0.6rem;
            flex-wrap: nowrap;
        }

        .categories-inner button {
            flex-shrink: 0;
            padding: 0.4rem 1.2rem;
            border: none;
            border-radius: 50px;
            background: #f5f3f0;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
            color: #4a4a4a;
        }

        .categories-inner button.active {
            background: #dc2626;
            color: #fff;
        }

        .categories-inner button:hover:not(.active) {
            background: #e8e5e0;
        }

        /* ========== SORTING ========== */
        .sorting-section {
            max-width: 1300px;
            margin: 1rem auto 0;
            padding: 0 1.5rem;
            display: flex;
            justify-content: flex-end;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .sorting-section select {
            padding: 0.4rem 1rem;
            border: 2px solid #e5e5e5;
            border-radius: 50px;
            background: #fff;
            font-size: 0.8rem;
            outline: none;
            cursor: pointer;
        }

        .sorting-section select:focus {
            border-color: #dc2626;
        }

        /* ========== HERO BANNER ========== */
        .hero-banner {
            max-width: 1300px;
            margin: 1.5rem auto 0;
            padding: 0 1.5rem;
        }

        .hero-banner .banner-content {
            background: linear-gradient(135deg, #fef2f2, #fee2e2);
            border-radius: 24px;
            padding: 2rem 2.5rem;
            border: 1px solid #fecaca;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .banner-content h2 {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 800;
            color: #dc2626;
        }

        .banner-content p {
            color: #6b6560;
            font-size: 1rem;
        }

        .banner-content .timer {
            background: #dc2626;
            color: #fff;
            padding: 0.3rem 1.5rem;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.1rem;
        }

        /* ========== TRUST BAR ========== */
        .trust-bar {
            max-width: 1300px;
            margin: 1.2rem auto 0;
            padding: 0 1.5rem;
        }

        .trust-bar .trust-inner {
            display: flex;
            justify-content: center;
            gap: 2.5rem;
            flex-wrap: wrap;
            background: #fff;
            padding: 0.7rem 1.5rem;
            border-radius: 60px;
            border: 1px solid #f0eeeb;
            font-size: 0.75rem;
            font-weight: 500;
            color: #4a4a4a;
        }

        .trust-inner span {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        /* ========== PRODUCTS ========== */
        .products-section {
            max-width: 1300px;
            margin: 2rem auto 0;
            padding: 0 1.5rem;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .section-header h3 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .section-header span {
            color: #6b6560;
            font-size: 0.85rem;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        .product-card {
            background: #fff;
            border-radius: 20px;
            padding: 1.2rem 1rem 1.2rem;
            border: 1px solid #f0eeeb;
            transition: 0.25s;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
            border-color: #e5e5e5;
        }

        .product-card .wishlist-icon {
            position: absolute;
            top: 0.6rem;
            right: 0.6rem;
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            transition: 0.2s;
            z-index: 2;
        }

        .product-card .wishlist-icon:hover {
            transform: scale(1.2);
        }

        .product-card .wishlist-icon.active {
            color: #dc2626;
        }

        .product-card .emoji {
            font-size: 3.2rem;
            margin-bottom: 0.5rem;
            pointer-events: none;
        }

        .product-card .name {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 0.2rem;
            flex: 1;
            pointer-events: none;
        }

        .product-card .rating {
            font-size: 0.75rem;
            color: #f59e0b;
            margin-bottom: 0.2rem;
            pointer-events: none;
        }

        .product-card .price {
            font-weight: 700;
            color: #dc2626;
            font-size: 1.1rem;
            margin: 0.2rem 0 0.6rem;
            pointer-events: none;
        }

        .product-card .price small {
            font-weight: 400;
            color: #999;
            font-size: 0.7rem;
            text-decoration: line-through;
            margin-left: 0.4rem;
        }

        .product-card .add-btn {
            background: #dc2626;
            color: #fff;
            padding: 0.5rem 1.2rem;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
            pointer-events: auto;
        }

        .product-card .add-btn:hover {
            background: #b91c1c;
            transform: scale(1.02);
        }

        .product-card .add-btn.in-cart {
            background: #22c55e;
        }

        .product-card .add-btn.in-cart:hover {
            background: #16a34a;
        }

        .product-card .stock-badge {
            font-size: 0.65rem;
            color: #22c55e;
            font-weight: 600;
            pointer-events: none;
            margin-bottom: 0.2rem;
        }

        .product-card .stock-badge.out-of-stock {
            color: #dc2626;
        }

        /* ========== PRODUCT DETAIL MODAL ========== */
        .product-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            z-index: 5000;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .product-modal.open {
            display: flex;
        }

        .product-modal-content {
            background: #fff;
            border-radius: 32px;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 2rem;
            position: relative;
            animation: modalSlide 0.3s ease;
        }

        @keyframes modalSlide {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .product-modal-content .close-modal {
            position: absolute;
            top: 1rem;
            right: 1.5rem;
            font-size: 2rem;
            background: none;
            border: none;
            cursor: pointer;
            opacity: 0.4;
            transition: 0.2s;
        }

        .product-modal-content .close-modal:hover {
            opacity: 0.8;
        }

        .modal-product-detail {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        .modal-product-detail .modal-emoji {
            font-size: 6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8f7f5;
            border-radius: 20px;
            min-height: 200px;
        }

        .modal-product-detail .modal-info h2 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .modal-product-detail .modal-info .modal-price {
            font-size: 1.5rem;
            color: #dc2626;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .modal-product-detail .modal-info .modal-desc {
            color: #6b6560;
            margin-bottom: 1rem;
        }

        .modal-product-detail .modal-info .modal-reviews {
            margin-bottom: 0.5rem;
            color: #f59e0b;
        }

        .modal-product-detail .modal-info .modal-stock {
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .modal-product-detail .modal-info .modal-stock.in-stock {
            color: #22c55e;
        }

        .modal-product-detail .modal-info .modal-stock.out-of-stock {
            color: #dc2626;
        }

        .modal-product-detail .modal-info .modal-actions {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .modal-product-detail .modal-info .modal-actions button {
            padding: 0.6rem 1.5rem;
            border-radius: 50px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .modal-product-detail .modal-info .modal-actions .add-to-cart-modal {
            background: #dc2626;
            color: #fff;
        }

        .modal-product-detail .modal-info .modal-actions .add-to-cart-modal:hover {
            background: #b91c1c;
        }

        .modal-product-detail .modal-info .modal-actions .wishlist-modal {
            background: #f5f3f0;
            color: #1a1a1a;
        }

        .modal-product-detail .modal-info .modal-actions .wishlist-modal:hover {
            background: #e8e5e0;
        }

        .modal-product-detail .modal-info .modal-actions .wishlist-modal.active {
            background: #fef2f2;
            color: #dc2626;
        }

        /* Related Products */
        .related-products {
            margin-top: 2rem;
            border-top: 1px solid #f0eeeb;
            padding-top: 1.5rem;
        }

        .related-products h4 {
            margin-bottom: 1rem;
            color: #6b6560;
        }

        .related-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 0.8rem;
        }

        .related-grid .related-item {
            background: #f8f7f5;
            border-radius: 12px;
            padding: 0.8rem;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .related-grid .related-item:hover {
            background: #f0eeeb;
            transform: translateY(-2px);
        }

        .related-grid .related-item .r-emoji {
            font-size: 2rem;
        }

        .related-grid .related-item .r-name {
            font-size: 0.7rem;
            font-weight: 500;
        }

        .related-grid .related-item .r-price {
            font-size: 0.7rem;
            color: #dc2626;
            font-weight: 600;
        }

        /* ========== CART PANEL ========== */
        .cart-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: 0.25s;
        }

        .cart-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .cart-panel {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            max-width: 420px;
            background: #fff;
            z-index: 3000;
            transform: translateX(100%);
            transition: 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            box-shadow: -4px 0 30px rgba(0, 0, 0, 0.08);
        }

        .cart-panel.open {
            transform: translateX(0);
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1rem;
            border-bottom: 1px solid #f0eeeb;
            font-weight: 700;
            font-size: 1.2rem;
        }

        .cart-header button {
            background: none;
            border: none;
            font-size: 1.6rem;
            cursor: pointer;
            opacity: 0.4;
            transition: 0.2s;
        }

        .cart-header button:hover {
            opacity: 0.8;
        }

        .cart-body {
            flex: 1;
            overflow-y: auto;
            padding: 1rem 0;
        }

        .cart-footer {
            border-top: 1px solid #f0eeeb;
            padding-top: 1rem;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.6rem 0;
            border-bottom: 1px solid #f5f3f0;
        }

        .cart-item .item-emoji {
            font-size: 1.8rem;
            width: 44px;
            height: 44px;
            background: #f8f7f5;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .cart-item .item-info {
            flex: 1;
        }

        .cart-item .item-name {
            font-size: 0.85rem;
            font-weight: 500;
        }

        .cart-item .item-price {
            font-size: 0.8rem;
            color: #dc2626;
            font-weight: 600;
        }

        .cart-item .item-qty {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            margin-top: 0.2rem;
        }

        .cart-item .item-qty button {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 1px solid #e5e5e5;
            background: #f8f7f5;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
        }

        .cart-item .item-qty button:hover {
            background: #e5e5e5;
        }

        .cart-item .item-remove {
            background: none;
            border: none;
            color: #999;
            font-size: 1rem;
            cursor: pointer;
            padding: 0.2rem 0.5rem;
        }

        .cart-item .item-remove:hover {
            color: #dc2626;
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            font-size: 1.1rem;
            margin: 0.4rem 0 0.8rem;
        }

        .coupon-section {
            display: flex;
            gap: 0.6rem;
            margin-bottom: 0.8rem;
        }

        .coupon-section input {
            flex: 1;
            padding: 0.5rem 1rem;
            border: 2px solid #e5e5e5;
            border-radius: 50px;
            font-size: 0.8rem;
            outline: none;
            background: #f8f7f5;
        }

        .coupon-section input:focus {
            border-color: #dc2626;
        }

        .coupon-section button {
            padding: 0.5rem 1.2rem;
            background: #8b5cf6;
            color: #fff;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .coupon-section button:hover {
            background: #7c3aed;
        }

        .coupon-message {
            font-size: 0.75rem;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .coupon-message.success {
            color: #22c55e;
        }

        .coupon-message.error {
            color: #dc2626;
        }

        .cart-checkout-btn {
            background: #dc2626;
            color: #fff;
            padding: 0.8rem;
            border: none;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            width: 100%;
            cursor: pointer;
            transition: 0.2s;
        }

        .cart-checkout-btn:hover {
            background: #b91c1c;
        }

        .cart-checkout-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .empty-cart {
            color: #999;
            text-align: center;
            padding: 2.5rem 0;
        }

        .empty-cart .big-emoji {
            font-size: 4rem;
            display: block;
            margin-bottom: 0.5rem;
        }

        /* ========== CHECKOUT PANEL ========== */
        .checkout-form {
            padding: 0.5rem 0;
        }

        .checkout-form .form-group {
            margin-bottom: 0.8rem;
        }

        .checkout-form label {
            display: block;
            font-size: 0.7rem;
            font-weight: 600;
            color: #6b6560;
            margin-bottom: 0.2rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .checkout-form input,
        .checkout-form select,
        .checkout-form textarea {
            width: 100%;
            padding: 0.6rem 1rem;
            border: 2px solid #e5e5e5;
            border-radius: 30px;
            font-size: 0.9rem;
            outline: none;
            transition: 0.2s;
            background: #f8f7f5;
            font-family: inherit;
        }

        .checkout-form input:focus,
        .checkout-form select:focus,
        .checkout-form textarea:focus {
            border-color: #dc2626;
            background: #fff;
        }

        .checkout-form textarea {
            border-radius: 16px;
            resize: vertical;
            min-height: 60px;
        }

        .checkout-form .row2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem;
        }

        .payment-methods {
            display: flex;
            gap: 0.6rem;
            margin: 0.8rem 0;
            flex-wrap: wrap;
        }

        .payment-methods button {
            padding: 0.4rem 1.2rem;
            border: 2px solid #e5e5e5;
            border-radius: 40px;
            background: #fff;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.15s;
        }

        .payment-methods button.active {
            border-color: #dc2626;
            background: #fef2f2;
            color: #dc2626;
        }

        .payment-methods button:hover:not(.active) {
            background: #f5f3f0;
        }

        .pay-btn {
            background: #22c55e;
            color: #fff;
            padding: 0.8rem;
            border: none;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1rem;
            width: 100%;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 0.5rem;
        }

        .pay-btn:hover {
            background: #16a34a;
        }

        .back-to-cart {
            background: none;
            border: none;
            color: #6b6560;
            font-size: 0.85rem;
            cursor: pointer;
            padding: 0.4rem 0;
            margin-top: 0.5rem;
        }

        .back-to-cart:hover {
            color: #1a1a1a;
        }

        /* ========== AUTH MODAL ========== */
        .auth-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            z-index: 6000;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .auth-modal.open {
            display: flex;
        }

        .auth-modal-content {
            background: #fff;
            border-radius: 32px;
            max-width: 480px;
            width: 100%;
            padding: 2.5rem;
            position: relative;
            animation: modalSlide 0.3s ease;
        }

        .auth-modal-content .close-auth {
            position: absolute;
            top: 1rem;
            right: 1.5rem;
            font-size: 2rem;
            background: none;
            border: none;
            cursor: pointer;
            opacity: 0.4;
            transition: 0.2s;
        }

        .auth-modal-content .close-auth:hover {

            if (currentCategory !== 'all') {
                filtered = filtered.filter(p => p.category === currentCategory);
            }

            // Search filter
            const query = searchInput.value.toLowerCase().trim();
            if (query) {
                filtered = filtered.filter(p =>
                    p.name.toLowerCase().includes(query) ||
                    p.category.includes(query)
                );
            }

            // Sorting
            switch (currentSort) {
                case 'price-low':
                    filtered.sort((a, b) => a.price - b.price);
                    break;
                case 'price-high':
                    filtered.sort((a, b) => b.price - a.price);
                    break;
                case 'rating':
                    filtered.sort((a, b) => b.rating - a.rating);
                    break;
                default: // popular (bestseller first)
                    filtered.sort((a, b) => (b.bestseller ? 1 : 0) - (a.bestseller ? 1 : 0));
            }

            productCount.textContent = `Showing ${filtered.length} products`;

            if (filtered.length === 0) {

                        <p>No products found matching your search.</p>

                return;

                                onclick="event.stopPropagation(); toggleCartItem(${p.id})">

            if (!product) return;

            const inCart = cart.some(item => item.id === product.id);
            const inWishlist = wishlist.some(item => item.id === product.id);
            const stockStatus = product.inStock ? '✅ In Stock' : '❌ Out of Stock';
            const stockClass = product.inStock ? 'in-stock' : 'out-of-stock';

            modalContent.innerHTML = `
                <div class="modal-emoji">${product.emoji}</div>
                <div class="modal-info">
                    <h2>${product.name}</h2>
                    <div class="modal-price">₹${product.price} <small style="text-decoration:line-through;color:#999;font-size:1rem;">₹${product.originalPrice}</small></div>
                    <div class="modal-reviews">⭐ ${product.rating} (${product.reviews} reviews)</div>
                    <div class="modal-stock ${stockClass}">${stockStatus}</div>
                    <p class="modal-desc">${product.description}</p>
                    <div class="modal-actions">
                        <button class="add-to-cart-modal" onclick="toggleCartItem(${product.id}); closeProductModal();">
                            ${inCart ? '✓ In Cart' : '🛒 Add to Cart'}
                        </button>
                        <button class="wishlist-modal ${inWishlist ? 'active' : ''}"

                            ${inWishlist ? '❤️ In Wishlist' : '🤍 Add to Wishlist'}
                        </button>
                    </div>
                </div>
            `;

            // Related products (same category, excluding current)
            const related = products
                .filter(p => p.category === product.category && p.id !== product.id)
                .slice(0, 4);

            if (related.length > 0) {

                        `).join('')}
                    </div>
                `;
            } else {
                relatedProducts.innerHTML = '';
            }

            productModal.classList.add('open');
            document.body.style.overflow = 'hidden';

        //  CATEGORY FILTER
        // ================================================================
        document.querySelectorAll('.categories-inner button').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.categories-inner button').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentCategory = this.dataset.cat;
                renderProducts();
            });
        });

        // ================================================================
        //  SORTING
        // ================================================================
        sortSelect.addEventListener('change', function() {
            currentSort = this.value;
            renderProducts();
        });

        // ================================================================
        //  SEARCH
        // ================================================================
        searchInput.addEventListener('input', renderProducts);

        // ================================================================
        //  WISHLIST FUNCTIONS
        // ================================================================
        function toggleWishlistItem(productId) {
            const existing = wishlist.find(item => item.id === productId);
            const product = products.find(p => p.id === productId);
            
            if (existing) {
                wishlist = wishlist.filter(item => item.id !== productId);
                showToast('🗑️ Removed from wishlist');
            } else {
                wishlist.push({ ...product });
                showToast(`❤️ ${product.emoji} ${product.name} added to wishlist!`);
            }
            
            saveWishlist();
            renderProducts();
            updateWishlistBadge();
            renderWishlist();
        }

        function saveWishlist() {
            localStorage.setItem('store99_wishlist', JSON.stringify(wishlist));
        }

        function updateWishlistBadge() {
            wishlistBadge.textContent = wishlist.length;
        }

        function toggleWishlist() {
            if (wishlistPanel.classList.contains('open')) {
                closeWishlist();
            } else {
                openWishlist();
            }
        }

        function openWishlist() {
            wishlistPanel.classList.add('open');
            cartOverlay.classList.add('open');
            renderWishlist();
        }

        function closeWishlist() {
            wishlistPanel.classList.remove('open');
            cartOverlay.classList.remove('open');
        }

        function renderWishlist() {
            if (wishlist.length === 0) {
                wishlistBody.innerHTML = `
                    <div class="empty-cart">
                        <span class="big-emoji">❤️</span>
                        <p>Your wishlist is empty</p>
                        <p style="font-size:0.8rem;margin-top:0.3rem;">Start saving your favorite items!</p>
                    </div>
                `;
                wishlistFooter.innerHTML = '';
                return;
            }

            wishlistBody.innerHTML = wishlist.map(item => `
                <div class="cart-item">
                    <div class="item-emoji">${item.emoji}</div>
                    <div class="item-info">
                        <div class="item-name">${item.name}</div>
                        <div class="item-price">₹${item.price}</div>
                    </div>
                    <button class="item-remove" onclick="moveToCart(${item.id})" title="Move to Cart">🛒</button>
                    <button class="item-remove" onclick="toggleWishlistItem(${item.id})" title="Remove">✕</button>
                </div>
            `).join('');

            wishlistFooter.innerHTML = `
                <button class="cart-checkout-btn" onclick="closeWishlist()">Continue Shopping</button>
            `;
        }

        function moveToCart(productId) {
            const product = wishlist.find(item => item.id === productId);
            if (product) {
                // Add to cart if not already there
                const inCart = cart.some(item => item.id === productId);
                if (!inCart) {
                    cart.push({ ...product, qty: 1 });
                    saveCart();
                    updateBadge();
                    showToast(`✅ ${product.emoji} ${product.name} moved to cart!`);
                } else {
                    showToast('⚠️ Already in cart!');
                }
                // Remove from wishlist
                wishlist = wishlist.filter(item => item.id !== productId);
                saveWishlist();
                updateWishlistBadge();
                renderWishlist();
                renderProducts();
            }
        }

        // ================================================================
        //  CART FUNCTIONS
        // ================================================================
        function toggleCartItem(productId) {
            const existing = cart.find(item => item.id === productId);
            if (existing) {
                cart = cart.filter(item => item.id !== productId);
                showToast('🗑️ Removed from cart');
            } else {
                const product = products.find(p => p.id === productId);
                if (!product.inStock) {
                    showToast('⚠️ Out of stock!');
                    return;
                }
                cart.push({ ...product, qty: 1 });
                showToast(`✅ ${product.emoji} ${product.name} added!`);
            }
            saveCart();
            renderProducts();
            updateBadge();
            renderCart();
        }

        function updateQuantity(productId, delta) {
            const item = cart.find(i => i.id === productId);
            if (!item) return;

            item.qty += delta;
            if (item.qty <= 0) {
                cart = cart.filter(i => i.id !== productId);
            }
            saveCart();
            updateBadge();
            renderCart();
            renderProducts();
        }

        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            saveCart();
            updateBadge();
            renderCart();
            renderProducts();
            showToast('🗑️ Removed from cart');
        }

        function saveCart() {
            localStorage.setItem('store99_cart', JSON.stringify(cart));
        }

        function updateBadge() {
            const count = cart.reduce((sum, item) => sum + item.qty, 0);
            cartBadge.textContent = count;
        }

        // ================================================================
        //  CART PANEL
        // ================================================================
        function toggleCart() {
            if (cartPanel.classList.contains('open')) {
                closeCart();
            } else {
                openCart();
            }
        }

        function openCart() {
            currentView = 'cart';
            discountApplied = false;
            discountAmount = 0;
            couponCode = '';
            cartPanel.classList.add('open');
            cartOverlay.classList.add('open');
            renderCart();
        }

        function closeCart() {
            cartPanel.classList.remove('open');
            cartOverlay.classList.remove('open');
        }

        function applyCoupon() {
            const input = document.getElementById('couponInput');
            const code = input.value.trim().toUpperCase();
            const messageEl = document.getElementById('couponMessage');

            if (code === 'FIRST99') {
                discountApplied = true;
                discountAmount = 50;
                couponCode = code;
                messageEl.textContent = '✅ Coupon applied! ₹50 off!';
                messageEl.className = 'coupon-message success';
                renderCart();
            } else if (code === '') {
                messageEl.textContent = '⚠️ Please enter a coupon code';
                messageEl.className = 'coupon-message error';
            } else {
                messageEl.textContent = '❌ Invalid coupon code';
                messageEl.className = 'coupon-message error';
            }
        }

        function renderCart() {
            if (cart.length === 0) {
                cartBody.innerHTML = `
                    <div class="empty-cart">
                        <span class="big-emoji">🛒</span>
                        <p>Your cart is empty</p>
                        <p style="font-size:0.8rem;margin-top:0.3rem;">Add some amazing ₹99 items!</p>
                    </div>
                `;
                cartFooter.innerHTML = `
                    <button class="cart-checkout-btn" disabled>Checkout</button>
                `;
                return;
            }

            let subtotal = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
            let total = subtotal - discountAmount;

            cartBody.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <div class="item-emoji">${item.emoji}</div>
                    <div class="item-info">
                        <div class="item-name">${item.name}</div>
                        <div class="item-price">₹${item.price}</div>
                        <div class="item-qty">
                            <button onclick="updateQuantity(${item.id}, -1)">−</button>
                            <span>${item.qty}</span>
                            <button onclick="updateQuantity(${item.id}, 1)">+</button>
                        </div>
                    </div>
                    <button class="item-remove" onclick="removeFromCart(${item.id})">✕</button>
                </div>
            `).join('');

            cartFooter.innerHTML = `
                <div class="coupon-section">
                    <input type="text" id="couponInput" placeholder="Enter coupon code" />
                    <button onclick="applyCoupon()">Apply</button>
                </div>
                <div id="couponMessage" class="coupon-message"></div>
                <div class="cart-total">
                    <span>Subtotal</span>
                    <span>₹${subtotal}</span>
                </div>
                ${discountApplied ? `
                <div class="cart-total" style="color:#22c55e;font-size:0.9rem;">
                    <span>Discount (${couponCode})</span>
                    <span>-₹${discountAmount}</span>
                </div>
                ` : ''}
                <div class="cart-total">
                    <span>Total</span>
                    <span>₹${total}</span>
                </div>
                <button class="cart-checkout-btn" onclick="openCheckout()">Proceed to Checkout →</button>
            `;
        }

        // ================================================================
        //  CHECKOUT WITH SHIPPING ADDRESS
        // ================================================================
        function openCheckout() {
            if (cart.length === 0) {
                showToast('Cart is empty!');
                return;
            }
            if (!loggedInUser) {
                showToast('⚠️ Please login to checkout');
                toggleAuth();
                return;
            }
            currentView = 'checkout';
            renderCheckout();
        }

        function renderCheckout() {
            const subtotal = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
            const total = subtotal - discountAmount;

            cartBody.innerHTML = `
                <div style="margin-bottom:1rem;padding:0.8rem 1rem;background:#f8f7f5;border-radius:12px;">
                    <div style="font-weight:600;">Order Summary</div>
                    <div style="font-size:0.85rem;color:#6b6560;">
                        ${cart.length} item${cart.length > 1 ? 's' : ''} · Total: ₹${total}
                    </div>
                </div>

                <div class="checkout-form">
                    <h4 style="margin-bottom:0.8rem;">📦 Shipping Address</h4>
                    
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="shipName" placeholder="John Doe" required />
                    </div>
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" id="shipPhone" placeholder="9876543210" required />
                    </div>
                    <div class="form-group">
                        <label>Complete Address</label>
                        <textarea id="shipAddress" placeholder="House no., Street, Landmark" required></textarea>
                    </div>
                    <div class="row2">
                        <div class="form-group">
                            <label>City</label>
                            <input type="text" id="shipCity" placeholder="Mumbai" required />
                        </div>
                        <div class="form-group">
                            <label>State</label>
                            <input type="text" id="shipState" placeholder="Maharashtra" required />
                        </div>
                    </div>
                    <div class="form-group">
                        <label>PIN Code</label>
                        <input type="text" id="shipPincode" placeholder="400001" required />
                    </div>

                    <h4 style="margin:1rem 0 0.8rem;">💳 Payment Method</h4>
                    <div class="payment-methods">
                        <button class="active" onclick="selectPayment(this, 'card')">💳 Card</button>
                        <button onclick="selectPayment(this, 'upi')">📱 UPI</button>
                        <button onclick="selectPayment(this, 'cod')">💵 COD</button>
                    </div>

                    <div id="paymentForm">
                        <div class="form-group">
                            <label>Card Number</label>
                            <input type="text" placeholder="1234 5678 9012 3456" />
                        </div>
                        <div class="row2">
                            <div class="form-group">
                                <label>Expiry</label>
                                <input type="text" placeholder="MM/YY" />
                            </div>
                            <div class="form-group">
                                <label>CVC</label>
                                <input type="text" placeholder="•••" />
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Name on Card</label>
                            <input type="text" placeholder="John Doe" />
                        </div>
                    </div>

                    <button class="pay-btn" onclick="processPayment()">Pay ₹${total} Now</button>
                    <button class="back-to-cart" onclick="renderCart(); currentView='cart';">← Back to Cart</button>
                </div>
            `;

            cartFooter.innerHTML = '';
        }

        function selectPayment(btn, method) {
            document.querySelectorAll('.payment-methods button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const form = document.getElementById('paymentForm');
            if (method === 'cod') {
                form.innerHTML = `
                    <div style="padding:1.5rem;text-align:center;color:#6b6560;background:#f8f7f5;border-radius:12px;">
                        💵 Cash on Delivery — pay when you receive!
                    </div>
                `;
            } else if (method === 'upi') {
                form.innerHTML = `
                    <div style="padding:1.5rem;text-align:center;color:#6b6560;background:#f8f7f5;border-radius:12px;">
                        📱 Scan QR code or enter UPI ID: <strong>store99@pay</strong>
                    </div>
                `;
            } else {
                form.innerHTML = `
                    <div class="form-group">
                        <label>Card Number</label>
                        <input type="text" placeholder="1234 5678 9012 3456" />
                    </div>
                    <div class="row2">
                        <div class="form-group">
                            <label>Expiry</label>
                            <input type="text" placeholder="MM/YY" />
                        </div>
                        <div class="form-group">
                            <label>CVC</label>
                            <input type="text" placeholder="•••" />
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Name on Card</label>
                        <input type="text" placeholder="John Doe" />
                    </div>
                `;
            }
        }

        function processPayment() {
            if (cart.length === 0) {
                showToast('Cart is empty!');
                return;
            }

            // Validate shipping address
            const name = document.getElementById('shipName')?.value.trim();
            const phone = document.getElementById('shipPhone')?.value.trim();
            const address = document.getElementById('shipAddress')?.value.trim();
            const city = document.getElementById('shipCity')?.value.trim();
            const state = document.getElementById('shipState')?.value.trim();
            const pincode = document.getElementById('shipPincode')?.value.trim();

            if (!name || !phone || !address || !city || !state || !pincode) {
                showToast('⚠️ Please fill all shipping details');
                return;
            }

            if (phone.length < 10) {
                showToast('⚠️ Please enter a valid phone number');
                return;
            }

            const total = cart.reduce((sum, item) => sum + item.price * item.qty, 0) - discountAmount;

            // Create order
            const order = {
                id: 'ORD' + Date.now().toString().slice(-8),
                items: cart.map(item => ({ ...item })),
                total: total,
                date: new Date().toISOString(),
                status: 'Processing',
                shippingAddress: { name, phone, address, city, state, pincode }
            };

            orders.push(order);
            localStorage.setItem('store99_orders', JSON.stringify(orders));

            showToast(`✅ Payment of ₹${total} successful! Order #${order.id} placed! 🎉`);

            cart = [];
            saveCart();
            updateBadge();
            closeCart();
            renderProducts();
            renderCart();
            renderOrderHistory();
        }

        // ================================================================
        //  AUTH FUNCTIONS
        // ================================================================
        function toggleAuth() {
            if (authModal.classList.contains('open')) {
                closeAuth();
            } else {
                openAuth();
            }
        }

        function openAuth() {
            authModal.classList.add('open');
            document.body.style.overflow = 'hidden';
            renderAuthForm();
            renderOrderHistory();
        }

        function closeAuth() {
            authModal.classList.remove('open');
            document.body.style.overflow = '';
        }

        authModal.addEventListener('click', (e) => {
            if (e.target === authModal) closeAuth();
        });

        function switchAuthTab(tab) {
            currentAuthTab = tab;
            document.querySelectorAll('.auth-tabs button').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.auth === tab);
            });
            renderAuthForm();
        }

        function renderAuthForm() {
            if (loggedInUser) {
                authTitle.textContent = `👤 Welcome, ${loggedInUser}`;
                authForm.innerHTML = `
                    <div style="text-align:center;padding:0.5rem 0;">
                        <p style="color:#6b6560;margin-bottom:1rem;">You are currently logged in.</p>
                        <button class="auth-btn" onclick="logoutUser()" style="background:#dc2626;">Logout</button>
                    </div>
                `;
                return;
            }

            authTitle.textContent = '👤 Account';

            if (currentAuthTab === 'login') {
                authForm.innerHTML = `
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="loginEmail" placeholder="your@email.com" />
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="loginPassword" placeholder="••••••••" />
                    </div>
                    <button class="auth-btn" onclick="loginUser()">Login</button>
                    <div id="authMessage" class="auth-error"></div>
                `;
            } else {
                authForm.innerHTML = `
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="signupName" placeholder="John Doe" />
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="signupEmail" placeholder="your@email.com" />
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="signupPassword" placeholder="••••••••" />
                    </div>
                    <button class="auth-btn" onclick="signupUser()">Create Account</button>
                    <div id="authMessage" class="auth-error"></div>
                `;
            }
        }

        function loginUser() {
            const email = document.getElementById('loginEmail')?.value.trim();
            const password = document.getElementById('loginPassword')?.value.trim();
            const message = document.getElementById('authMessage');

            if (!email || !password) {
                message.textContent = '⚠️ Please fill all fields';
                return;
            }

            const users = JSON.parse(localStorage.getItem('store99_users')) || [];
            const user = users.find(u => u.email === email && u.password === password);

            if (user) {
                loggedInUser = user.name;
                localStorage.setItem('store99_user', loggedInUser);
                message.textContent = '✅ Login successful!';
                message.className = 'auth-success';
                showToast(`✅ Welcome back, ${loggedInUser}!`);
                setTimeout(() => {
                    renderAuthForm();
                    renderOrderHistory();
                    closeAuth();
                }, 500);
            } else {
                message.textContent = '❌ Invalid email or password';
                message.className = 'auth-error';
            }
        }

        function signupUser() {
            const name = document.getElementById('signupName')?.value.trim();
            const email = document.getElementById('signupEmail')?.value.trim();
            const password = document.getElementById('signupPassword')?.value.trim();
            const message = document.getElementById('authMessage');

            if (!name || !email || !password) {
                message.textContent = '⚠️ Please fill all fields';
                message.className = 'auth-error';
                return;
            }

            if (password.length < 6) {
                message.textContent = '⚠️ Password must be at least 6 characters';
                message.className = 'auth-error';
                return;
            }

            const users = JSON.parse(localStorage.getItem('store99_users')) || [];
            
            if (users.some(u => u.email === email)) {
                message.textContent = '❌ Email already registered';
                message.className = 'auth-error';
                return;
            }

            users.push({ name, email, password });
            localStorage.setItem('store99_users', JSON.stringify(users));

            loggedInUser = name;
            localStorage.setItem('store99_user', loggedInUser);
            
            message.textContent = '✅ Account created successfully!';
            message.className = 'auth-success';
            showToast(`🎉 Welcome, ${name}!`);
            
            setTimeout(() => {
                renderAuthForm();
                renderOrderHistory();
                closeAuth();
            }, 500);
        }

        function logoutUser() {
            loggedInUser = null;
            localStorage.removeItem('store99_user');
            showToast('👋 Logged out successfully');
            renderAuthForm();
            renderOrderHistory();
            closeAuth();
        }

        // ================================================================
        //  ORDER HISTORY
        // ================================================================
        function renderOrderHistory() {
            if (!loggedInUser || orders.length === 0) {
                orderHistoryList.innerHTML = `
                    <div style="color:#999;font-size:0.85rem;padding:0.5rem 0;">
                        ${!loggedInUser ? 'Login to view your orders' : 'No orders yet'}
                    </div>
                `;
                return;
            }

            orderHistoryList.innerHTML = orders.slice().reverse().map(order => `
                <div class="order-item">
                    <div class="order-header">
                        <span class="order-id">#${order.id}</span>
                        <span class="order-status ${order.status.toLowerCase()}">${order.status}</span>
                    </div>
                    <div class="order-details">
                        ${order.items.map(item => `${item.emoji} ${item.name} ×${item.qty}`).join(', ')}
                        <br />
                        ₹${order.total} · ${new Date(order.date).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' })}
                    </div>
                </div>
            `).join('');
        }

        // ================================================================
        //  TOAST
        // ================================================================
        let toastTimeout;

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // ================================================================
        //  TIMER (demo)
        // ================================================================
        function updateTimer() {
            const timer = document.getElementById('timerDisplay');
            const parts = timer.textContent.replace('⏰ ', '').split(':');
            let h = parseInt(parts[0]);
            let m = parseInt(parts[1]);
            let s = parseInt(parts[2]);

            s--;
            if (s < 0) { s = 59;
                m--; }
            if (m < 0) { m = 59;
                h--; }
            if (h < 0) { h = 0;
                m = 0;
                s = 0; }

            timer.textContent = `⏰ ${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        // ================================================================
        //  INIT
        // ================================================================
        renderProducts();
        updateBadge();
        updateWishlistBadge();
        renderCart();
        renderWishlist();

        // Timer update every second
        setInterval(updateTimer, 1000);

        // Close panels on Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeCart();
                closeWishlist();
                closeProductModal();
                closeAuth();
            }
        });

        console.log('🛒 ₹99 Store Enhanced loaded successfully!');
        console.log(`📦 ${cart.length} items in cart`);
        console.log(`❤️ ${wishlist.length} items in wishlist`);
        console.log(`📋 ${products.length} products available`);
        console.log(`📦 ${orders.length} orders placed`);
        console.log(`👤 ${loggedInUser ? 'Logged in as: ' + loggedInUser : 'Not logged in'}`);
    </script>

</body>
</html>
