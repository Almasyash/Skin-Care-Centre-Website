<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0" />
  <title>₹99 Store — Impulse Buy</title>
  <style>
    /* ----- reset & base ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #f8f6f2;
      color: #1e1a16;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      line-height: 1.5;
      padding-bottom: 80px;
    }
    a {
      text-decoration: none;
      color: inherit;
    }
    button {
      cursor: pointer;
      border: none;
      font-family: inherit;
      font-size: inherit;
    }
    input,
    select {
      font-family: inherit;
      font-size: inherit;
    }

    /* ----- container ----- */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1rem;
    }

    /* ----- header / nav ----- */
    .header {
      background: #fff;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 0.6rem 0;
    }
    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.6rem;
    }
    .logo {
      font-weight: 800;
      font-size: 1.4rem;
      color: #e53e3e;
      letter-spacing: -0.02em;
    }
    .logo span {
      background: #e53e3e;
      color: #fff;
      padding: 0.1rem 0.5rem;
      border-radius: 30px;
      font-size: 0.7rem;
      margin-left: 0.2rem;
    }
    .header-search {
      flex: 1;
      max-width: 400px;
      min-width: 140px;
      position: relative;
    }
    .header-search input {
      width: 100%;
      padding: 0.5rem 1rem 0.5rem 2.4rem;
      border-radius: 40px;
      border: 1px solid #e8e3dc;
      background: #f8f6f2;
      font-size: 0.85rem;
      outline: none;
      transition: 0.2s;
    }
    .header-search input:focus {
      border-color: #e53e3e;
      background: #fff;
    }
    .header-search .icon {
      position: absolute;
      left: 0.8rem;
      top: 50%;
      transform: translateY(-50%);
      opacity: 0.4;
      font-size: 0.9rem;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }
    .header-actions button {
      background: none;
      font-size: 1.2rem;
      position: relative;
      padding: 0.2rem 0.3rem;
      border-radius: 30px;
      transition: 0.15s;
    }
    .header-actions button:hover {
      background: #f0ede8;
    }
    .badge {
      position: absolute;
      top: -6px;
      right: -6px;
      background: #e53e3e;
      color: #fff;
      font-size: 0.55rem;
      font-weight: 700;
      padding: 0.1rem 0.4rem;
      border-radius: 30px;
      min-width: 18px;
      text-align: center;
    }

    /* ----- category tabs (scroll) ----- */
    .category-tabs {
      display: flex;
      gap: 0.6rem;
      overflow-x: auto;
      padding: 0.8rem 0 1rem;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      flex-wrap: nowrap;
    }
    .category-tabs::-webkit-scrollbar {
      display: none;
    }
    .category-tabs button {
      flex-shrink: 0;
      padding: 0.4rem 1rem;
      border-radius: 40px;
      background: #f0ede8;
      font-size: 0.75rem;
      font-weight: 500;
      transition: 0.2s;
      white-space: nowrap;
      border: 1px solid transparent;
    }
    .category-tabs button.active {
      background: #e53e3e;
      color: #fff;
      border-color: #e53e3e;
    }
    .category-tabs button:hover:not(.active) {
      background: #e8e3dc;
    }

    /* ----- product grid ----- */
    .section-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin: 1.2rem 0 0.2rem;
    }
    .section-sub {
      color: #6b6560;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
      gap: 1rem;
    }
    .product-card {
      background: #fff;
      border-radius: 16px;
      padding: 0.8rem 0.8rem 1rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
      border: 1px solid #f0ede8;
      transition: 0.2s;
      display: flex;
      flex-direction: column;
    }
    .product-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }
    .product-img {
      aspect-ratio: 1/1;
      background: #f8f6f2;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.4rem;
      margin-bottom: 0.5rem;
    }
    .product-name {
      font-weight: 600;
      font-size: 0.85rem;
      line-height: 1.3;
      flex: 1;
    }
    .product-price {
      font-weight: 700;
      color: #e53e3e;
      font-size: 1.1rem;
      margin: 0.2rem 0 0.4rem;
    }
    .product-price small {
      font-weight: 400;
      color: #999;
      font-size: 0.7rem;
      text-decoration: line-through;
      margin-left: 0.4rem;
    }
    .product-rating {
      font-size: 0.7rem;
      color: #f59e0b;
      margin-bottom: 0.3rem;
    }
    .add-btn {
      background: #e53e3e;
      color: #fff;
      padding: 0.5rem 0;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.8rem;
      transition: 0.15s;
      width: 100%;
      border: none;
      margin-top: auto;
    }
    .add-btn:hover {
      background: #c53030;
      transform: scale(1.02);
    }
    .add-btn.outline {
      background: transparent;
      color: #e53e3e;
      border: 1px solid #e53e3e;
    }
    .add-btn.outline:hover {
      background: #e53e3e;
      color: #fff;
    }

    /* ----- cart / checkout panels (slide) ----- */
    .panel-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.3);
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: 0.25s;
    }
    .panel-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }
    .panel {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      max-width: 420px;
      background: #fff;
      z-index: 300;
      transform: translateX(100%);
      transition: 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      padding: 1.2rem 1.2rem 1.5rem;
      display: flex;
      flex-direction: column;
      box-shadow: -4px 0 30px rgba(0, 0, 0, 0.08);
    }
    .panel.open {
      transform: translateX(0);
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 0.8rem;
      border-bottom: 1px solid #f0ede8;
      font-weight: 600;
      font-size: 1.1rem;
    }
    .panel-header button {
      background: none;
      font-size: 1.4rem;
      padding: 0 0.2rem;
      opacity: 0.5;
    }
    .panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 0.8rem 0;
    }
    .panel-footer {
      border-top: 1px solid #f0ede8;
      padding-top: 0.8rem;
      margin-top: auto;
    }
    .cart-item {
      display: flex;
      gap: 0.8rem;
      padding: 0.6rem 0;
      border-bottom: 1px solid #f5f2ed;
      align-items: center;
    }
    .cart-item .ci-img {
      width: 48px;
      height: 48px;
      background: #f8f6f2;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      flex-shrink: 0;
    }
    .cart-item .ci-info {
      flex: 1;
    }
    .cart-item .ci-name {
      font-size: 0.8rem;
      font-weight: 500;
    }
    .cart-item .ci-price {
      font-size: 0.8rem;
      color: #e53e3e;
      font-weight: 600;
    }
    .cart-item .ci-qty {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      margin-top: 0.2rem;
    }
    .cart-item .ci-qty button {
      background: #f0ede8;
      width: 26px;
      height: 26px;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: 600;
      transition: 0.15s;
    }
    .cart-item .ci-qty button:hover {
      background: #e8e3dc;
    }
    .cart-item .ci-remove {
      background: none;
      color: #999;
      font-size: 0.8rem;
      padding: 0.2rem 0.5rem;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      font-weight: 700;
      font-size: 1.1rem;
      margin: 0.4rem 0 0.8rem;
    }
    .checkout-btn {
      background: #e53e3e;
      color: #fff;
      padding: 0.8rem;
      border-radius: 60px;
      font-weight: 600;
      width: 100%;
      font-size: 1rem;
      transition: 0.15s;
      text-align: center;
    }
    .checkout-btn:hover {
      background: #c53030;
    }
    .checkout-btn:disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    /* ----- payment form (inside panel) ----- */
    .payment-section {
      margin-top: 0.5rem;
    }
    .payment-section .row {
      margin-bottom: 0.8rem;
    }
    .payment-section label {
      font-size: 0.7rem;
      font-weight: 500;
      color: #6b6560;
      display: block;
      margin-bottom: 0.2rem;
    }
    .payment-section input,
    .payment-section select {
      width: 100%;
      padding: 0.6rem 0.8rem;
      border-radius: 30px;
      border: 1px solid #e8e3dc;
      background: #f8f6f2;
      font-size: 0.85rem;
      outline: none;
    }
    .payment-section input:focus {
      border-color: #e53e3e;
    }
    .payment-methods {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      margin: 0.6rem 0;
    }
    .payment-methods button {
      padding: 0.4rem 1rem;
      border-radius: 40px;
      border: 1px solid #e8e3dc;
      background: #fff;
      font-size: 0.75rem;
      font-weight: 500;
      transition: 0.15s;
    }
    .payment-methods button.active {
      border-color: #e53e3e;
      background: #fff5f5;
      color: #e53e3e;
    }
    .pay-now-btn {
      background: #22c55e;
      color: #fff;
      padding: 0.8rem;
      border-radius: 60px;
      font-weight: 700;
      width: 100%;
      font-size: 1rem;
      margin-top: 0.4rem;
      transition: 0.15s;
    }
    .pay-now-btn:hover {
      background: #16a34a;
    }

    /* ----- toast / notification ----- */
    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e1a16;
      color: #fff;
      padding: 0.6rem 1.4rem;
      border-radius: 60px;
      font-size: 0.85rem;
      font-weight: 500;
      z-index: 500;
      opacity: 0;
      transition: 0.25s;
      pointer-events: none;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
      white-space: nowrap;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(-6px);
    }

    /* ----- empty state ----- */
    .empty-state {
      color: #999;
      text-align: center;
      padding: 2rem 0;
      font-size: 0.9rem;
    }

    /* ----- trust bar ----- */
    .trust-bar {
      display: flex;
      justify-content: center;
      gap: 2rem;
      flex-wrap: wrap;
      background: #fff;
      padding: 0.8rem 1rem;
      border-radius: 60px;
      margin: 1.2rem 0;
      border: 1px solid #f0ede8;
      font-size: 0.7rem;
      font-weight: 500;
      color: #4a4540;
    }
    .trust-bar span {
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    /* ----- responsive ----- */
    @media (max-width: 600px) {
      .header-inner {
        flex-wrap: wrap;
      }
      .header-search {
        order: 3;
        max-width: 100%;
        flex-basis: 100%;
      }
      .logo {
        font-size: 1.1rem;
      }
      .product-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 0.8rem;
      }
      .product-card {
        padding: 0.6rem;
      }
      .product-img {
        font-size: 1.8rem;
      }
      .panel {
        max-width: 100%;
        padding: 1rem;
      }
      .trust-bar {
        gap: 0.8rem;
        font-size: 0.6rem;
        padding: 0.6rem 0.8rem;
      }
    }
    @media (max-width: 400px) {
      .product-grid {
        grid-template-columns: 1fr 1fr;
        gap: 0.5rem;
      }
    }
  </style>
</head>

      border-radius: 28px;
      padding: 1.2rem 1.2rem 1.5rem;
      transition: 0.25s ease;
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
    }
    .product-card:hover {
      transform: translateY(-6px);
      border-color: rgba(249, 115, 22, 0.2);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    .product-img {
      aspect-ratio: 1 / 1;
      background: radial-gradient(circle at 30% 20%, #2a2520, #141217);
      border-radius: 20px;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.6rem;
      border: 1px solid rgba(255, 255, 255, 0.02);
    }
    .product-name {
      font-weight: 500;
      font-size: 1rem;
      margin-bottom: 0.2rem;
    }
    .product-price {
      font-weight: 600;
      color: #f97316;
      font-size: 1.1rem;
      margin-top: 0.2rem;
    }
    .product-desc {
      font-size: 0.7rem;
      opacity: 0.3;
      margin: 0.3rem 0 0.8rem 0;
      flex: 1;
    }
    .add-btn {
      background: linear-gradient(135deg, #f97316, #ea580c);
      color: #fff;
      padding: 0.6rem 0;
      border-radius: 60px;
      font-weight: 500;
      font-size: 0.8rem;
      transition: 0.2s;
      width: 100%;
      border: none;
      margin-top: 0.4rem;
    }
    .add-btn:hover {
      transform: scale(1.02);
      box-shadow: 0 8px 24px rgba(249, 115, 22, 0.25);
    }

    /* ----- cart page ----- */
    .cart-list {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      margin: 1.5rem 0 2rem 0;
      max-width: 700px;
    }
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.02);
      padding: 0.8rem 1.2rem;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.03);
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .cart-item .name {
      font-weight: 400;
      flex: 1;
    }
    .cart-item .price {
      color: #f97316;
      font-weight: 500;
    }
    .cart-item .qty {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .cart-item .qty button {
      background: rgba(255, 255, 255, 0.04);
      color: #eaeaea;
      width: 28px;
      height: 28px;
      border-radius: 40px;
      font-size: 1rem;
      transition: 0.2s;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }
    .cart-item .qty button:hover {
      background: rgba(255, 255, 255, 0.08);
    }
    .cart-item .remove {
      background: none;
      color: rgba(255, 255, 255, 0.2);
      font-size: 0.7rem;
      padding: 0.2rem 0.8rem;
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 40px;
      transition: 0.2s;
    }
    .cart-item .remove:hover {
      color: #ef4444;
      border-color: #ef4444;
    }
    .cart-total {
      font-size: 1.2rem;
      font-weight: 600;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
      padding-top: 1.2rem;
      display: flex;
      justify-content: space-between;
      max-width: 700px;
    }
    .checkout-btn {
      background: linear-gradient(135deg, #f97316, #ea580c);
      color: #fff;
      padding: 0.8rem 2.4rem;
      border-radius: 60px;
      font-weight: 600;
      font-size: 0.9rem;
      transition: 0.2s;
      margin-top: 0.8rem;
    }
    .checkout-btn:hover {
      transform: scale(1.02);
      box-shadow: 0 8px 30px rgba(249, 115, 22, 0.3);
    }

    /* ----- payment page ----- */
    .payment-box {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 32px;
      padding: 2rem 2.5rem;
      max-width: 560px;
      margin-top: 1rem;
      backdrop-filter: blur(4px);
    }
    .payment-box .row {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      margin-bottom: 1.2rem;
    }
    .payment-box label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: rgba(255, 255, 255, 0.3);
    }
    .payment-box input {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 30px;
      padding: 0.7rem 1.2rem;
      color: #eaeaea;
      font-size: 0.9rem;
      outline: none;
      transition: 0.3s;
      font-family: inherit;
    }
    .payment-box input:focus {
      border-color: #f97316;
      background: rgba(249, 115, 22, 0.04);
    }
    .payment-box .row2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    .pay-btn {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #fff;
      padding: 0.9rem;
      border-radius: 60px;
      font-weight: 600;
      font-size: 1rem;
      width: 100%;
      margin-top: 0.8rem;
      transition: 0.2s;
    }
    .pay-btn:hover {
      transform: scale(1.01);
      box-shadow: 0 8px 30px rgba(34, 197, 94, 0.25);
    }

    /* ----- empty state ----- */
    .empty-state {
      color: rgba(255, 255, 255, 0.2);
      font-size: 0.9rem;
      padding: 2rem 0;
    }

    /* ----- responsive ----- */
    @media (max-width: 720px) {
      .container {
        padding: 0 1rem;
      }
      .header {
        padding: 0.8rem 1rem;
        flex-direction: column;
        align-items: stretch;
        gap: 0.5rem;
      }
      .nav-links {
        gap: 1rem;
        font-size: 0.7rem;
        flex-wrap: wrap;
      }
      .product-grid {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 1rem;
      }
      .payment-box {
        padding: 1.5rem;
      }
      .payment-box .row2 {
        grid-template-columns: 1fr;
      }
    }
    @media (max-width: 480px) {
      .product-grid {
        grid-template-columns: 1fr 1fr;
      }
      .cart-item {
        flex-direction: column;
        align-items: stretch;
        gap: 0.4rem;
      }
    }
  </style>
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="header">
    <span class="logo">🛒 99 Bazar</span>
    <div class="nav-links">
      <a href="#" data-page="home">Home</a>
      <a href="#" data-page="cart">Cart <span class="cart-badge" id="cartCount">0</span></a>
      <a href="#" data-page="payment">Payment</a>
    </div>
  </header>

  <!-- ===== MAIN CONTENT ===== -->
  <main class="container">

    <!-- HOME / PRODUCTS -->
    <section class="page active" id="page-home">
      <h2 class="section-title">✨ Featured items</h2>
      <p class="section-sub">Grab your favorites — fast, secure, and hassle‑free.</p>
      <div class="product-grid" id="productGrid">
        <!-- injected via JS -->
      </div>
    </section>

    <!-- CART -->
    <section class="page" id="page-cart">
      <h2 class="section-title">🛒 Your cart</h2>
      <p class="section-sub">Review your items before checkout.</p>
      <div id="cartContainer">
        <div class="cart-list" id="cartList"></div>
        <div class="cart-total" id="cartTotal">
          <span>Total</span>
          <span id="totalPrice">$0.00</span>
        </div>
        <button class="checkout-btn" id="goToPayment">Proceed to Payment →</button>
      </div>
      <div class="empty-state" id="emptyCart">Your cart is empty. Start shopping!</div>
    </section>

    <!-- PAYMENT -->
    <section class="page" id="page-payment">
      <h2 class="section-title">💳 Payment</h2>
      <p class="section-sub">Complete your order securely.</p>
      <div class="payment-box">
        <div class="row">
          <label>Card number</label>
          <input type="text" placeholder="1234 5678 9012 3456" />
        </div>
        <div class="row2">
          <div class="row">
            <label>Expiry</label>
            <input type="text" placeholder="MM / YY" />
          </div>
          <div class="row">
            <label>CVC</label>
            <input type="text" placeholder="•••" />
          </div>
        </div>
        <div class="row">
          <label>Name on card</label>
          <input type="text" placeholder="John Doe" />
        </div>
        <button class="pay-btn" id="payNow">Pay now — $<span id="payAmount">0.00</span></button>
        <p style="font-size:0.6rem; opacity:0.2; margin-top:0.8rem;">🔒 Secured · test mode</p>
      </div>
    </section>

  </main>

  <script>
    // ===== PRODUCT DATA =====
    const products = [{
      id: 1,
      name: 'Wireless Buds Pro',
      price: 49.99,
      desc: 'Noise‑cancelling, 24h battery',
      emoji: '🎧'
    }, {
      id: 2,
      name: 'Smart Watch S8',
      price: 89.99,
      desc: 'Heart rate, GPS, AMOLED',
      emoji: '⌚'
    }, {
      id: 3,
      name: 'USB‑C Hub 6‑in‑1',
      price: 29.99,
      desc: 'HDMI, Ethernet, SD card',
      emoji: '🔌'
    }, {
      id: 4,
      name: 'Ergonomic Mouse',
      price: 24.99,
      desc: 'Wireless, silent click',
      emoji: '🖱️'
    }, {
      id: 5,
      name: 'Laptop Stand Pro',
      price: 39.99,
      desc: 'Aluminum, foldable',
      emoji: '💻'
    }, {
      id: 6,
      name: 'Desk Mat XL',
      price: 19.99,
      desc: 'Waterproof, stitched edge',
      emoji: '🧶'
    }];

    // ===== STATE =====
    let cart = JSON.parse(localStorage.getItem('cart99')) || [];

    // ===== DOM REFS =====
    const productGrid = document.getElementById('productGrid');
    const cartList = document.getElementById('cartList');
    const totalPrice = document.getElementById('totalPrice');
    const cartCount = document.getElementById('cartCount');
    const emptyCart = document.getElementById('emptyCart');
    const goToPayment = document.getElementById('goToPayment');
    const payAmount = document.getElementById('payAmount');

    // ===== RENDER PRODUCTS =====
    function renderProducts() {
      productGrid.innerHTML = products.map(p => `
        <div class="product-card">
          <div class="product-img">${p.emoji}</div>
          <div class="product-name">${p.name}</div>
          <div class="product-price">$${p.price.toFixed(2)}</div>
          <div class="product-desc">${p.desc}</div>
          <button class="add-btn" data-id="${p.id}">Add to cart</button>
        </div>
      `).join('');
      // event listeners
      productGrid.querySelectorAll('.add-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = parseInt(btn.dataset.id);
          addToCart(id);
        });
      });
    }

    // ===== CART FUNCTIONS =====
    function addToCart(id) {
      const existing = cart.find(item => item.id === id);
      if (existing) {
        existing.qty += 1;
      } else {
        const product = products.find(p => p.id === id);
        cart.push({ ...product, qty: 1 });
      }
      saveAndRender();
    }

    function removeFromCart(id) {
      cart = cart.filter(item => item.id !== id);
      saveAndRender();
    }

    function changeQty(id, delta) {
      const item = cart.find(i => i.id === id);
      if (!item) return;
      item.qty += delta;
      if (item.qty <= 0) {
        removeFromCart(id);
        return;
      }
      saveAndRender();
    }

    function saveAndRender() {
      localStorage.setItem('cart99', JSON.stringify(cart));
      renderCart();
      updateBadge();
      updatePayAmount();
    }

    function renderCart() {
      if (cart.length === 0) {
        cartList.innerHTML = '';
        emptyCart.style.display = 'block';
        totalPrice.textContent = '$0.00';
        return;
      }
      emptyCart.style.display = 'none';
      cartList.innerHTML = cart.map(item => `
        <div class="cart-item">
          <span class="name">${item.emoji} ${item.name}</span>
          <span class="price">$${(item.price * item.qty).toFixed(2)}</span>
          <div class="qty">
            <button data-id="${item.id}" data-delta="-1">−</button>
            <span>${item.qty}</span>
            <button data-id="${item.id}" data-delta="1">+</button>
          </div>
          <button class="remove" data-id="${item.id}">✕</button>
        </div>
      `).join('');

      const total = cart.reduce((sum, i) => sum + i.price * i.qty, 0);
      totalPrice.textContent = '$' + total.toFixed(2);

      // event listeners for cart buttons
      cartList.querySelectorAll('.qty button').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const id = parseInt(btn.dataset.id);
          const delta = parseInt(btn.dataset.delta);
          changeQty(id, delta);
        });
      });
      cartList.querySelectorAll('.remove').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = parseInt(btn.dataset.id);
          removeFromCart(id);
        });
      });
    }

    function updateBadge() {
      const count = cart.reduce((sum, i) => sum + i.qty, 0);
      cartCount.textContent = count;
    }

    function updatePayAmount() {
      const total = cart.reduce((sum, i) => sum + i.price * i.qty, 0);
      payAmount.textContent = total.toFixed(2);
    }

    // ===== NAVIGATION (multi‑page) =====
    const pages = {
      home: document.getElementById('page-home'),
      cart: document.getElementById('page-cart'),
      payment: document.getElementById('page-payment'),
    };

    document.querySelectorAll('[data-page]').forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        const page = link.dataset.page;
        Object.values(pages).forEach(p => p.classList.remove('active'));
        pages[page].classList.add('active');
        // if payment, update amount
        if (page === 'payment') updatePayAmount();
        if (page === 'cart') renderCart();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    });

    // go to payment from cart
    goToPayment.addEventListener('click', () => {
      if (cart.length === 0) {
        alert('Your cart is empty. Add some items first!');
        return;
      }
      document.querySelector('[data-page="payment"]').click();
    });

    // pay now (simulate)
    document.getElementById('payNow').addEventListener('click', () => {
      if (cart.length === 0) {
        alert('Cart is empty. Nothing to pay for.');
        return;
      }
      const total = cart.reduce((sum, i) => sum + i.price * i.qty, 0);
      alert(`✅ Payment of $${total.toFixed(2)} successful! (demo)`);
      cart = [];
      saveAndRender();
      document.querySelector('[data-page="home"]').click();
    });

    // ===== INIT =====
    renderProducts();
    renderCart();
    updateBadge();
    updatePayAmount();
  </script>
</body>
</html>
